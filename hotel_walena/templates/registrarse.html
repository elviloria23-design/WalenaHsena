{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walena Hotel</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page">

    {% include 'inc/nav.html' %}

    <div class="login-overlay">
        <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
            <div class="row w-100 align-items-center justify-content-center g-4">

                <div class="col-lg-6 text-center text-lg-start text-white mb-4 mb-lg-0 pe-lg-5">
                    <div class="logo-wrapper mb-3 text-center text-lg-start">
                        <img src="{% static 'img/walenalogo.png' %}" alt="Walena Hotel Logo" class="img-fluid logo-img">
                    </div>
                    
                    <p1 class="slogan-text">
                        Tu descanso,<br>
                        nuestra mejor estancia
                    </p1>
                    
                    <div class="d-flex align-items-center gap-2 text-warning my-2" style="max-width: 280px;">
                        <hr class="flex-grow-1 opacity-100 my-0 border-warning">
                        <i class="bi bi-tree-fill"></i>
                        <hr class="flex-grow-1 opacity-100 my-0 border-warning">
                    </div>
                </div>

                <div class="col-lg-5 col-md-8 col-sm-10">
                    <div class="card card-login p-4 p-sm-5 border-gold">
                        <div class="text-center text-white mb-4">
                            <div class="login-icon-wrap mb-2">
                                <i class="bi bi-person-fill text-warning fs-1"></i>
                            </div>
                            <h3 class="fw-bold mb-1">Crear Cuenta</h3>
                            <p class="text-white-50 small mb-0">Accede al sistema de Walena Hotel</p>
                        </div>

                        {% if messages %}
                            <div class="mb-3">
                                {% for message in messages %}
                                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show text-center py-2 px-3 small" role="alert">
                                        <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ message }}
                                        <button type="button" class="btn-close btn-close-white py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                                    </div>
                                {% endfor %}
                            </div>
                        {% endif %}

                        <form method="POST" action="{% url 'crear_cuenta' %}" autocomplete="off">
                            {% csrf_token %}
                            <input type="text" name="username" class="form-control custom-input" placeholder="Usuario" required>
                            <input type="email" name="email" class="form-control custom-input" placeholder="Correo electrónico" required>
                            <input type="password" name="password" class="form-control custom-input" placeholder="Contraseña" required>
                            <input type="password" name="password_confirm" class="form-control custom-input" placeholder="Confirmar contraseña" required>
                            <button type="submit" class="btn btn-gold w-100 mt-3">crear cuenta</button>
                        </form>

                        <div class="text-center mt-4 pt-2 border-top border-secondary border-opacity-25">
                            <div class="d-flex align-items-center justify-content-center gap-2 text-warning mb-1">
                                <hr class="flex-grow-1 opacity-25">
                                <i class="bi bi-tree-fill"></i>
                                <hr class="flex-grow-1 opacity-25">
                            </div>
                            <small class="text-white-50">Tu lugar en el Caribe</small>
                        </div>

                    </div>
                </div>
            </div>

    <script>
        const toggleIcon = document.getElementById('toggleIcon');
        const passwordInput = document.getElementById('password');

        if (toggleIcon && passwordInput) {
            toggleIcon.parentElement.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.classList.toggle('bi-eye');
                toggleIcon.classList.toggle('bi-eye-slash');
            });
        }
    </script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
