<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificar Código - Walena Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121824;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-custom {
            background-color: #1e2636;
            border: 1px solid #f2c14e;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }
        .btn-custom {
            background-color: #f2c14e;
            color: #121824;
            font-weight: bold;
        }
        .btn-custom:hover {
            background-color: #d9ab3d;
        }
    </style>
</head>
<body>
    <div class="card-custom shadow-lg">
        <h3 class="text-center mb-3 text-warning">Verifica tu Correo</h3>
        <p class="text-center text-muted small mb-4">Ingresa el código de 6 dígitos que enviamos a tu bandeja de entrada.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 small">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="codigo" class="form-control text-center fs-4" placeholder="Ej: 123456" maxlength="6" required>
            </div>
            <button type="submit" class="btn btn-custom w-100 py-2">Verificar Cuenta</button>
        </form>
    </div>
</body>
</html>
