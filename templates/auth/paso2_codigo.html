{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código - Walena Hotel</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.min.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 bg-white" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: #00334e;">Código de Seguridad</h3>
            <p class="text-muted small">Paso 2: Ingresa el código de 6 dígitos que llegó a tu correo</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'success' %}success{% else %}danger{% endif %} alert-dismissible fade show small" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" autocomplete="off">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">Código de 6 dígitos</label>
                <input type="text" name="codigo" class="form-control bg-light border-0 text-center fs-3 tracking-widest" maxlength="6" placeholder="Ej: 123456" required>
            </div>

            <button type="submit" class="btn text-white w-100 py-2 rounded-3 fw-bold shadow-sm" style="background-color: #d97706; border: none;">
                Verificar Código
            </button>
        </form>
    </div>
</body>
</html>
