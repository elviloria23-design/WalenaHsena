{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - Walena Hotel</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.min.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 bg-white" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: #00334e;">Cambiar Contraseña</h3>
            <p class="text-muted small">Paso 3: Confirma tus datos y asigna tu nueva clave</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'success' %}success{% else %}danger{% endif %} alert-dismissible fade show small" role="alert">
                    <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% else %}bi-exclamation-triangle-fill{% endif %} me-1"></i> 
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" onclick="this.closest('.alert').remove()"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Usuario</label>
                <input type="text" name="username" class="form-control bg-light border-0" value="{{ username_val }}" required readonly>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Correo Electrónico</label>
                <input type="email" name="correo" class="form-control bg-light border-0" value="{{ correo_val }}" required readonly>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Nueva Contraseña</label>
                <input type="password" name="password" class="form-control bg-light border-0" placeholder="Nueva clave" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">Confirmar Nueva Contraseña</label>
                <input type="password" name="confirm_password" class="form-control bg-light border-0" placeholder="Repite la nueva clave" required>
            </div>

            <button type="submit" class="btn text-white w-100 py-2 rounded-3 fw-bold shadow-sm" style="background-color: #d97706; border: none;">
                Guardar Cambios e Iniciar Sesión
            </button>
        </form>
    </div>
</body>
</html>
