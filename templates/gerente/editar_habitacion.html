{% extends 'base_gerente.html' %}
{% load static %}

{% block title %}Editar Habitación N° {{ habitacion.numero }} - Walena Hotel{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg rounded-4 text-white p-4" style="background-color: #1e293b;">
                
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
                    <h3 class="fw-bold mb-0 text-warning">
                        <i class="bi bi-pencil-square me-2"></i>Editar Habitación N° {{ habitacion.numero }}
                    </h3>
                    <a href="{% url 'gerente_habitaciones' %}" class="btn btn-outline-light btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Cancelar
                    </a>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-light small">Número de Habitación</label>
                            <input type="number" name="numero" class="form-control bg-dark text-white border-secondary" value="{{ habitacion.numero }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-light small">Piso</label>
                            <input type="number" name="piso" class="form-control bg-dark text-white border-secondary" value="{{ habitacion.piso }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-light small">Tipo de Habitación</label>
                            <input type="text" name="tipo" class="form-control bg-dark text-white border-secondary" value="{{ habitacion.tipo }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-light small">Capacidad Máxima</label>
                            <input type="number" name="cap_max" class="form-control bg-dark text-white border-secondary" value="{{ habitacion.cap_max }}" disabled>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-light small">Precio por Noche (COP)</label>
                            <input type="number" step="0.01" name="precio_noche" class="form-control bg-dark text-white border-secondary" value="{{ habitacion.precio_noche }}" disabled>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-light small">Estado</label>
                            <select name="estado" class="form-select bg-dark text-white border-secondary">
                                <option value="Disponible" {% if habitacion.estado == 'Disponible' %}selected{% endif %}>Disponible</option>
                                <option value="Ocupada" {% if habitacion.estado == 'Ocupada' %}selected{% endif %}>Ocupada</option>
                                <option value="Mantenimiento" {% if habitacion.estado == 'Mantenimiento' %}selected{% endif %}>Mantenimiento</option>
                                <option value="Inactiva" {% if habitacion.estado == 'Inactiva' %}selected{% endif %}>Inactiva</option>
                            </select>
                        </div>

                        <div class="col-12 mt-4">
                            <hr class="border-secondary opacity-25">
                            <h5 class="text-warning small fw-bold mb-3"><i class="bi bi-images me-1"></i> Fotografías de la Habitación</h5>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-light small">Foto Principal</label>
                            <input type="file" name="foto1" class="form-control border-secondary">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light small">Foto 2</label>
                            <input type="file" name="foto2" class="form-control border-secondary">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light small">Foto 3</label>
                            <input type="file" name="foto3" class="form-control border-secondary">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light small">Foto 4</label>
                            <input type="file" name="foto4" class="form-control border-secondary">
                        </div>
                    </div>

                    <div class="mt-4 pt-2 text-end">
                        <button type="submit" class="btn btn-warning text-dark fw-bold rounded-pill px-4">
                            <i class="bi bi-check-circle me-1"></i> Guardar Cambios
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
